<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credencial Digital - DevGenn</title>

  <!-- Google Fonts: Bricolage Grotesque (títulos) + Atkinson Hyperlegible (datos) (Misión 6) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">

  <!-- Iconos Font Awesome mediante CDN (Misión 4) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- <article>: la credencial es una pieza de contenido independiente -->
  <article class="credencial">

    <!-- Insignia flotante: se posiciona con absolute (Misión 5) -->
    <span class="badge">frontend</span>

    <!-- SECCIÓN 1: Encabezado -->
    <header class="credencial-header">
      <p class="logo">DEV<span>genn</span></p>
    </header>

    <!-- SECCIÓN 2: Foto + datos -->
    <main class="credencial-body">

      <!-- Contenedor de la foto: ancla del ::after "online" (Bonus) -->
      <div class="avatar-contenedor">
        <img src="carlos.png" alt="Foto de Carlos Pérez" class="avatar-img">
      </div>

      <div class="info-usuario">
        <h1 class="usuario-nombre">Carlos Pérez</h1>
        <p class="usuario-rol">Fullstack Junior</p>

        <!-- <dl> = lista de pares etiqueta (dt) / valor (dd) -->
        <dl class="datos">
          <div><dt><i class="fa-solid fa-location-dot"></i>Ciudad</dt><dd>Bogotá</dd></div>
          <div><dt><i class="fa-solid fa-envelope"></i>Correo</dt><dd>carlos@devgenn.com</dd></div>
          <div><dt><i class="fa-brands fa-github"></i>GitHub</dt><dd>@carlosperez</dd></div>
          <div><dt><i class="fa-solid fa-code"></i>Tech favorita</dt><dd>Java y CSS</dd></div>
          <div><dt><i class="fa-solid fa-gamepad"></i>Hobby</dt><dd>Videojuegos</dd></div>
        </dl>
      </div>
    </main>

    <!-- SECCIÓN 3: Frase + código de barras -->
    <footer class="credencial-footer">
      <p class="frase">“Si puedes imaginarlo, puedes programarlo.”</p>
      <div class="codigo">
        <!-- aria-hidden: es decorativo, los lectores de pantalla lo ignoran -->
        <span class="barras" aria-hidden="true"></span>
        <span class="serial">DG-2026-0147</span>
      </div>
    </footer>

  </article>

</body>
</html>
